[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parallel-bench"
version = "0.1.0"
description = "Two-query DuckDB/Sirius concurrency experiments"
requires-python = ">=3.11"
# Install the matching DuckDB wheel explicitly: a PyPI dependency here could
# silently replace the custom build required by Sirius.
dependencies = []

[project.optional-dependencies]
sirius = ["PyYAML==6.0.3"]
dev = ["ruff==0.17.3", "mypy==2.4.0", "types-PyYAML==6.0.12.20260906"]

[project.scripts]
parallel-bench = "parallel_bench.cli:main"

[tool.setuptools.packages.find]
include = ["parallel_bench*"]

[tool.ruff]
line-length = 80
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "D", "ANN"]
# SQL cells and arbitrary metadata intentionally retain heterogeneous values.
ignore = ["ANN401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
files = ["parallel_bench"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
