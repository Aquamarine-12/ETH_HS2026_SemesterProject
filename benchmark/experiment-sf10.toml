# SF10 on both backends, with five samples at every connection count.
# Paths are relative to this file.
# Each sample/backend/cache/order combination gets its own N=1 baseline.
[run]
db = "data/sf10.duckdb"
device = "cpu"
connections = 2
sirius_extension = "~/.local/lib/sirius/sirius.duckdb_extension"
results_dir = "results"

[sweep]
devices = ["cpu", "gpu"]
warmup_streams = [0]  # Use [0, 5] to include warm-cache runs.
seeds = ["ASC", "DESC", "ASC-DESC", 42]
connections = [2, 3, 4, 5, 6, 7, 8, 9, 10]
samples = 5
